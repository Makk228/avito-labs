# Optional local alternative when tripgoctl is unavailable on the host OS.
# Application code exports OTLP only and does not depend on these backends.
name: avito-lab2-observability
services:
  jaeger:
    image: jaegertracing/all-in-one:1.76.0
    ports: ["127.0.0.1:16686:16686"]
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.143.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes: ["./observability/collector.yaml:/etc/otelcol/config.yaml:ro"]
    ports: ["127.0.0.1:4317:4317", "127.0.0.1:4318:4318"]
    depends_on: [jaeger, prometheus]
  prometheus:
    image: prom/prometheus:v3.9.1
    command: ["--config.file=/etc/prometheus/prometheus.yaml"]
    volumes: ["./observability/prometheus.yaml:/etc/prometheus/prometheus.yaml:ro"]
    ports: ["127.0.0.1:9090:9090"]
  grafana:
    image: grafana/grafana:12.3.2
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["127.0.0.1:3000:3000"]
