name: tripgo

x-trip-service: &trip-service
  build:
    context: ..
    dockerfile: deploy/Dockerfile
  image: trip-service:local
  env_file: ../.env.example
  extra_hosts:
    - host.docker.internal:host-gateway
  environment:
    DATABASE_URL: postgres://tripgo:tripgo@postgres:5432/tripgo?sslmode=disable
    OTEL_EXPORTER_OTLP_ENDPOINT: ${COMPOSE_OTLP_ENDPOINT:-http://host.docker.internal:4318}

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: tripgo
      POSTGRES_PASSWORD: tripgo
      POSTGRES_DB: tripgo
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tripgo -d tripgo"]
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    <<: *trip-service
    command: ["migrate", "up"]
    depends_on:
      postgres:
        condition: service_healthy

  trip-service:
    <<: *trip-service
    ports:
      - "8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
    stop_grace_period: 15s

volumes:
  postgres-data:
